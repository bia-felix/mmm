services:
  - type: web
    name: gracas-aventais-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUTTER_PASSWORD
        sync: false
      - key: EMBROIDERER_PASSWORD
        sync: false
